<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Missão Programador</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="caixa-principal">

        <header class="cabecalho">
            <div class="icone-codigo">&lt;/&gt;</div>

            <div>
                <span class="subtitulo">TESTE DE PERFIL</span>
                <h1>Missão Programador</h1>
            </div>
        </header>


        <section class="conteudo">

            <div class="progresso-container">
                <div class="progresso-info">
                    <span>PROGRESSO</span>
                    <span class="numero-pergunta">01 / 05</span>
                </div>

                <div class="progresso">
                    <div class="progresso-barra"></div>
                </div>
            </div>


            <section class="pergunta-container">

                <span class="label-pergunta">PERGUNTA</span>

                <div class="caixa-perguntas"></div>

            </section>


            <section class="caixa-alternativas"></section>


            <section class="caixa-resultado">

                <div class="resultado-icone">✓</div>

                <span class="resultado-label">SEU RESULTADO</span>

                <p class="texto-resultado"></p>

                <button class="botao-reiniciar" onclick="location.reload()">
                    Fazer novamente
                </button>

            </section>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
